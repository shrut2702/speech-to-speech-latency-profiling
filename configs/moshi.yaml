# Full-duplex baseline. No endpointing, no stages, one model.
# Verify real-time factor on this GPU before trusting any number.
name: moshi
system: moshi

# One model on one card.
gpu: A100-40GB

manifest: data/manifest.jsonl
clips_dir: data/clips
trials: 4
frame_ms: 20
# The mic keeps running while the user waits for an answer. Full-duplex models
# need these frames to keep generating; the cascade ignores them. Systems end
# the stream early by breaking out of their loop, so this is an upper bound,
# not a cost paid on every trial.
silence_after_s: 20.0
output_sample_rate: 24000

devices:
  moshi: 0

model:
  backend: kyutai
  repo: kyutai/moshiko-pytorch-bf16
  codebooks: 8
  # A frame counts as speech above this. Mimi's silence reads under 0.003 and
  # its speech over 0.02, with two empty decades between, so the value only has
  # to land in the gap. See research/moshi-profile.md for the distribution.
  rms_speech: 0.01
  # The reply is over once Moshi has been quiet this long. Measured on speech
  # frames, not on frames arriving: those never stop.
  silence_gap_s: 1.5
  max_response_s: 20
